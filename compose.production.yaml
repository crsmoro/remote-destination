# Candidate only: do not enable the route before the documented release gates.
services:
  backend:
    image: sha256:98a6a8eb7667f314019a4aed9d0ae8636bb32391982846e68ccf97aa9293ee6c
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_PATH: /data/destinations.db
      LISTEN_ADDR: :8080
      WAZE_MUNICIPIOS_FILE: /run/municipios/municipios.json
      WAZE_POSITION_FILE: /run/gps/position.json
      DEVICE_KEY_FILE: /run/secrets/device_key
      WAZE_GEOCODING_PROVIDER: google
      GOOGLE_GEOCODING_KEY_FILE: /run/secrets/google_geocoding_key
      GOOGLE_GEOCODING_LIMIT_DB: /data/google-geocoding-limit.db
      GOOGLE_PLACES_DAILY_LIMIT: "100"
      GOOGLE_PLACES_INTERVAL: 1s
      GOOGLE_GEOCODING_DAILY_LIMIT: "100"
      GOOGLE_GEOCODING_INTERVAL: 1s
      WAZE_EGRESS_PROXY: egress:3128
      AUTH0_AGENT_CLIENT_ID: ${AUTH0_AGENT_CLIENT_ID:?Set AUTH0_AGENT_CLIENT_ID}
      AUTH0_AGENT_ISSUER: https://morohome.us.auth0.com/
      AUTH0_AGENT_AUDIENCE: https://remote-destination.morohome.eu.org/hermes-api
    secrets: [device_key]
    group_add: ["48873"]
    volumes: ["destination_data:/data", "gps-deploy-df11bb52309749d6855e6f377d70b5b9-state:/run/gps:ro", "/etc/jarvis/hermes/data/waze-municipios-ibge:/run/municipios:ro", "/etc/jarvis/hermes/data/secrets/google-prep-b8e92e683d02/google_geocoding_key:/run/secrets/google_geocoding_key:ro"]
    networks: [private]
    labels:
      traefik.enable: "false"
  proxy:
    image: nginx:1.27-alpine
    user: "10000:10000"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./security-design/proxy.conf:/etc/nginx/nginx.conf:ro
      - ${WAZE_PROXY_PKI_DIR:?Set WAZE_PROXY_PKI_DIR to an absolute host directory}:/etc/waze-pki:ro
    networks: [private, traefik]
    labels:
      traefik.enable: "true"
      traefik.docker.network: "${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK}"
      traefik.http.routers.waze-remote.rule: "Host(`${WAZE_PUBLIC_HOST:?Set WAZE_PUBLIC_HOST}`)"
      traefik.http.routers.waze-remote.entrypoints: https
      traefik.http.routers.waze-remote.tls: "true"
      traefik.http.routers.waze-remote.service: waze-remote
      traefik.http.services.waze-remote.loadbalancer.server.port: "8443"
      traefik.http.services.waze-remote.loadbalancer.server.scheme: https
      traefik.http.services.waze-remote.loadbalancer.serverstransport: waze-remote-mtls@file
  egress:
    image: sha256:aa560e0c9d1e19065f0aa70436138b796a66f6e6ed027a3c12d074f4ce2d7e65
    build:
      context: ./server
      dockerfile: Dockerfile.egress
    restart: unless-stopped
    environment:
      AUTH0_AGENT_ISSUER: https://morohome.us.auth0.com/
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    networks: [private, outbound]
    labels:
      traefik.enable: "false"
secrets:
  device_key:
    file: ${DEVICE_KEY_HOST_FILE:?Set DEVICE_KEY_HOST_FILE to an absolute host file}
volumes:
  destination_data:
  gps-deploy-df11bb52309749d6855e6f377d70b5b9-state:
    external: true
networks:
  private:
    internal: true
  outbound: {}
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:?Set TRAEFIK_NETWORK}
