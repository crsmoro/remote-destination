<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Destino remoto</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><main><h1>Destino remoto</h1><p id="connection" role="status">Consultando conexão…</p><form id="destination-form"><label for="destination">Endereço ou link Google Maps ou Waze</label><textarea id="destination" maxlength="4096" required></textarea><button type="submit">Enviar destino</button></form><button id="cancel" type="button">Cancelar destino pendente</button><p id="state" role="status" aria-live="polite"></p><p id="pending-display"></p><p id="warning" role="alert"></p><p id="converted"></p><p>Cancelar ou substituir não desfaz uma intent já entregue ao carro. Intent enviada não confirma que a navegação iniciou. Uma queda entre salvar a tentativa e abrir o Waze pode fazer a tentativa ser perdida.</p></main></body></html>
